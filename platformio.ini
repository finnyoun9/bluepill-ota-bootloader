; Temporary build config for local verification
[platformio]
src_dir = .

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
build_src_filter =
    +<bootloader/Core/Src/>
    +<shared/>
    -<.git/>
    -<.pio/>
    -<application/>
    -<esp32-comm-bridge/>
    -<tools/>
    -<docs/>
build_flags =
    -I bootloader/Core/Inc
    -I shared
board_build.ldscript = bootloader/STM32F103C8TX_BOOT.ld
