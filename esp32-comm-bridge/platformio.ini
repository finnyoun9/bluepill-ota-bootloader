; PlatformIO project for ESP32 Communication Bridge
; Handles Bluetooth SPP + WiFi OTA download → UART to STM32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; Partition table must define a "storage" SPIFFS partition for fw staging
board_build.partitions = partitions.csv

; Compile the shared protocol source (lives one level up from src_dir).
; Only protocol.c is needed here — ota_config.c targets STM32 flash HAL.
build_src_filter =
    +<src/>
    +<../shared/protocol.c>

build_flags =
    ; Bluetooth is enabled via sdkconfig.defaults (Kconfig), not -D flags.
    ; Override credentials here instead of editing source:
    ; -D WIFI_SSID='"your_ssid"'
    ; -D WIFI_PASSWORD='"your_password"'

lib_deps =

; UART2 pins for STM32 communication
; GPIO16 = RX (from STM32 TX / PA2)
; GPIO17 = TX (to STM32 RX / PA3)
;
; Connect: ESP32 GND ↔ STM32 GND
;          ESP32 GPIO16 ← STM32 PA2 (TX)
;          ESP32 GPIO17 → STM32 PA3 (RX)
